name: Dependency review

on:
  schedule:
    # First Monday of each month, 14:00 UTC
    - cron: '0 14 1-7 * 1'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on any reported vulnerability)
        run: npm audit --omit=dev

      - name: Outdated dependency report
        id: outdated
        run: |
          set +e
          npm outdated > outdated.txt 2>&1
          code=$?
          cat outdated.txt
          if [ "$code" -ne 0 ]; then
            echo "has_outdated=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_outdated=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload outdated report
        if: steps.outdated.outputs.has_outdated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-outdated
          path: outdated.txt
          retention-days: 90